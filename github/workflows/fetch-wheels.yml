name: Fetch and commit Python 3.14 win_amd64 wheels

on:
  workflow_dispatch:

jobs:
  fetch-wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests packaging

      - name: Run wheel downloader
        run: python download_wheels.py

      - name: Commit and push wheels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wheels || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add downloaded cp314 win_amd64 wheels"
            git push
          fi
